databases:
  - name: campfire-db
    databaseName: campfire
    user: campfire_user

services:
  - type: web
    name: campfire-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campfire-db
          property: connectionString
